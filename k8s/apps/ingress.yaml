# =============================================================================
# INGRESS - Punto de entrada del tráfico externo
# =============================================================================
#
# ¿QUÉ ES UN INGRESS?
# Un Ingress define reglas para rutear tráfico HTTP/HTTPS externo hacia
# los Services internos del cluster. Funciona en conjunto con un
# Ingress Controller (AWS Load Balancer Controller en nuestro caso).
#
# FLUJO DE TRÁFICO:
# Usuario → Route53 → ALB (creado por el Ingress) → Pod del api-gateway
#
# ¿POR QUÉ AWS LOAD BALANCER CONTROLLER?
# - Crea ALBs nativos de AWS (no nginx)
# - Integración con WAF, Shield, ACM (certificados)
# - Target groups a nivel de pod (IP mode) = menor latencia
# - Health checks nativos de AWS
#
# ESCENARIO DE INCIDENTE #3 (TLS expirado):
# Si el certificado en ACM expira, el ALB rechaza conexiones HTTPS.
# El runbook documenta cómo renovar y verificar.
#
# EN ENTREVISTA: "Usé AWS Load Balancer Controller para crear ALBs nativos
# desde Kubernetes Ingress resources. Esto me da integración con WAF para
# protección contra DDoS, ACM para certificados TLS gestionados, y target
# groups en modo IP para menor latencia al evitar el doble hop de kube-proxy."
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: applications
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:001239102331:certificate/CERT_ID"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Health check configuration
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # WAF (protección contra DDoS - Escenario #5)
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:us-east-1:001239102331:regional/webacl/production-sim-waf/WAF_ID"
    # Tags
    alb.ingress.kubernetes.io/tags: "Environment=prod,Project=production-sim"
spec:
  rules:
    - host: api.production-sim.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
