# =============================================================================
# RESOURCE QUOTAS - Límites de recursos por namespace
# =============================================================================
#
# ¿POR QUÉ RESOURCE QUOTAS?
# Sin quotas, un solo deployment con memory leak puede consumir TODOS los
# recursos del cluster y causar un incidente masivo (noisy neighbor problem).
#
# Resource Quotas protegen contra:
# - Memory leaks que consumen toda la RAM del cluster
# - Fork bombs o procesos descontrolados
# - Un equipo monopolizando recursos compartidos
# - Deployments accidentales con 1000 replicas
#
# EN ENTREVISTA: "Implementé Resource Quotas por namespace para evitar el
# problema de 'noisy neighbor'. Si un servicio tiene un memory leak, solo
# puede consumir los recursos asignados a su namespace, protegiendo al
# resto del cluster."
# =============================================================================
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: applications-quota
  namespace: applications
spec:
  hard:
    requests.cpu: "4"          # Total de CPU requests (4 cores)
    requests.memory: "8Gi"     # Total de RAM requests
    limits.cpu: "8"            # Total de CPU limits
    limits.memory: "16Gi"      # Total de RAM limits
    pods: "30"                 # Máximo de pods en el namespace
    services: "10"             # Máximo de services
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"
    pods: "20"
