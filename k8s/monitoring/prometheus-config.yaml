# =============================================================================
# PROMETHEUS - Configuración para Kubernetes
# =============================================================================
#
# ¿QUÉ ES PROMETHEUS?
# Sistema de monitoreo y alerting open-source que:
# - Scrapes métricas de targets HTTP (pull model)
# - Almacena time series en su propia DB
# - Evalúa reglas de alerting
# - Se integra con Grafana para visualización
#
# ¿POR QUÉ PROMETHEUS EN EKS?
# - Estándar de facto para monitoreo en Kubernetes
# - Auto-discovery de pods (no necesitas registrar cada servicio)
# - Métricas de Kubernetes nativas (kube-state-metrics)
# - Ecosistema maduro de exporters y dashboards
#
# ¿CÓMO FUNCIONA EL AUTO-DISCOVERY?
# Prometheus usa las annotations de los pods para saber:
# - prometheus.io/scrape: "true" → Scrape este pod
# - prometheus.io/port: "9090" → En este puerto
# - prometheus.io/path: "/metrics" → En este path
#
# EN ENTREVISTA: "Desplegué Prometheus con auto-discovery de pods basado en
# annotations. Cada microservicio expone métricas en /metrics que Prometheus
# scrapes cada 15 segundos. Configuré alerting rules que disparan hacia
# SNS/PagerDuty cuando los SLOs se violan."
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: production-sim
        environment: prod

    # Reglas de alerting
    rule_files:
      - /etc/prometheus/rules/*.yml

    # Alertmanager
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    # Scrape configs con auto-discovery
    scrape_configs:
      # Métricas del propio Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Auto-discovery de pods con annotations
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Solo scrape pods con annotation prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Usar el puerto indicado en la annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}
          # Usar el path indicado
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Labels útiles
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      # Métricas de los nodos (node-exporter)
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # kube-state-metrics
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
